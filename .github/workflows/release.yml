name: Upload Release assets and npm publish.
on:
  # dispatch from tagpr.yml workflow
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: false
        default: 'v.0.0.0'
        description: 'Specify release tag'
jobs:
  npm-publish-job:
    name: Upload Release assets and npm publish.
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    # Sets permissions of the GITHUB_TOKEN to allow deployment
    permissions:
      contents: write # Upload Release assets
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          scope: '@katzumi'
      - name: Fix package.json version (strip v-prefix added by tagpr)
        run: npm pkg fix
      - run: npm pack
      - name: Get assets file name
        id: get-assets-file-name
        run: |
          assets=$(npm pack --json | jq -r '.[0].filename' | sed 's/^$//')
          echo "packFile=${assets}" >> $GITHUB_OUTPUT
      - name: Upload Release Asset
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.payload.inputs.tag
            });

            const packFile = '${{ steps.get-assets-file-name.outputs.packFile }}';
            const filePath = path.join(path.resolve(process.env.GITHUB_WORKSPACE), packFile);
            const fileContent = fs.readFileSync(filePath);

            // List all assets, including subsequent pages.
            const assets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                per_page: 100,
              }
            );

            // Delete an existing asset with the same name before uploading.
            for (const asset of assets.filter(asset => asset.name === packFile)) {
              core.info(`Deleting existing release asset: ${asset.name} (${asset.id})`);
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
              });
            }

            await github.rest.repos.uploadReleaseAsset({
              url: release.data.upload_url,
              headers: {
                'content-type': 'application/octet-stream',
                'content-length': fileContent.length,
              },
              name: packFile,
              data: fileContent,
            });

      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: npm publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true
